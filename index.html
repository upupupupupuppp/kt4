<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url(https://i.pinimg.com/1200x/bf/fb/80/bffb80caedf935b4d2021d6e70342882.jpg);
            background-attachment: fixed;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        .car-container {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 200px;
            height: 80px;
            animation: drive 5s linear 3 forwards;
        }

        .car {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .car-body {
            position: absolute;
            bottom: 0;
            width: 180px;
            height: 50px;
            background: #d4c7a2;
            border-radius: 15px 15px 5px 5px;
        }

        .car-top {
            position: absolute;
            bottom: 40px;
            left: 30px;
            width: 120px;
            height: 40px;
            background: #d4c7a2;
            border-radius: 10px 10px 0 0;
        }
        
        .wheel {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #333;
            border-radius: 50%;
            bottom: -10px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: rotate 0.5s linear infinite;
        }
        .front-wheel {
            left: 20px;
        }

        .rear-wheel {
            right: 20px;
        }

         @keyframes drive {
            0% {
                left: -200px;
            }
            100% {
                left: calc(100% - 250px);
            }
            
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="car-container">
        <div class="car">
            <div class="car-body"></div>
            <div class="car-top"></div>
            <div class="window front-window"></div>
            <div class="window rear-window"></div>
            <div class="light front-light"></div>
            <div class="light rear-light"></div>
            <div class="wheel front-wheel"></div>
            <div class="wheel rear-wheel"></div>
        </div>
    </div>
</body>

</html>
